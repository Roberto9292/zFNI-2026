<div class="location-detail-container">
  <div class="header">
    <div class="title-section">
      <h2>{{ location.subject }}</h2>
    </div>
    <button mat-icon-button (click)="close()" class="close-btn">
      <mat-icon fontIcon="close"></mat-icon>
    </button>
  </div>

  <div class="content">
    <div class="info-grid">
      <div class="info-item">
        <mat-icon fontIcon="person" color="primary"></mat-icon>
        <div>
          <label>Docente</label>
          <span>{{ location.teacher }}</span>
        </div>
      </div>

      <div class="info-item">
        <mat-icon fontIcon="school" color="primary"></mat-icon>
        <div>
          <label>Carrera</label>
          <span>{{ location.career || "—" }}</span>
        </div>
      </div>

      <div class="info-item">
        <mat-icon fontIcon="apartment" color="primary"></mat-icon>
        <div>
          <label>Bloque</label>
          <span>{{ location.block || "—" }}</span>
        </div>
      </div>

      <div class="info-item">
        <mat-icon fontIcon="class" color="primary"></mat-icon>
        <div>
          <label>Paralelo</label>
          <span>{{ location.parallel }}</span>
        </div>
      </div>

      <div class="info-item">
        <mat-icon fontIcon="schedule" color="primary"></mat-icon>
        <div>
          <label>Horario</label>
          <span>{{ location.schedule }}</span>
        </div>
      </div>

      <div class="info-item">
        <mat-icon fontIcon="place" color="primary"></mat-icon>
        <div>
          <label>Coordenadas</label>
          <span>{{ location.latitude }}, {{ location.longitude }}</span>
        </div>
      </div>
    </div>

    <div class="acciones">
      <button mat-flat-button type="button" (click)="comoLlegar()">
        <mat-icon fontIcon="directions"></mat-icon>
        Cómo llegar
      </button>

      <button mat-stroked-button type="button" (click)="abrirEnGoogleMaps()">
        <mat-icon fontIcon="open_in_new"></mat-icon>
        Abrir en Google Maps
      </button>
    </div>
  </div>
</div>
